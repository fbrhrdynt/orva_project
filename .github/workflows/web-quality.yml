name: ORVA Web Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Keep only the newest quality run for this PR/branch.
# Rapid commits should not leave a queue of obsolete checks.
concurrency:
  group: orva-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate database schema
        env:
          DATABASE_URL: postgresql://orva:orva@localhost:5432/orva?schema=public
        run: pnpm db:validate
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
