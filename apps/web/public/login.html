<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Sign in — ORVA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#18263b;font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.login{width:min(100%,420px)}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800;letter-spacing:-1px;margin-bottom:42px}.mark{width:42px;height:42px;background:#1c3150;color:#fff;border-radius:13px;display:grid;place-items:center;font-size:22px}.brand span{color:#5679dc}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:800;color:#7d8ba0}.card{background:#fff;border:1px solid #e8edf4;border-radius:20px;padding:34px;box-shadow:0 18px 50px #1b35500c}.card h1{font-size:25px;letter-spacing:-.8px;margin:9px 0 7px}.sub{color:#77859a;font-size:13px;line-height:1.7;margin:0 0 28px}label{display:block;font-size:12px;font-weight:700;margin:17px 0 8px}input{width:100%;height:48px;border:1px solid #dfe5ee;border-radius:10px;padding:0 13px;font:inherit;font-size:13px;outline:none}input:focus{border-color:#6684e8;box-shadow:0 0 0 3px #6684e81c}button{width:100%;height:49px;border:0;border-radius:10px;background:#233b60;color:white;font:inherit;font-size:13px;font-weight:800;margin-top:24px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;color:#c34d58;font-size:12px;margin-top:14px}.foot{text-align:center;color:#9aa5b5;font-size:11px;margin-top:22px}@media(max-width:480px){.card{padding:25px}.brand{margin-bottom:30px}}
</style></head><body><main class="login"><div class="brand"><div class="mark">o.</div>orva<span>.</span></div><section class="card"><div class="eyebrow">YOUR WORKSPACE</div><h1>Welcome back</h1><p class="sub">Sign in once to access your ORVA workspace and applications.</p><form id="form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="name@company.com" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit" type="submit">Sign in to ORVA</button><div class="error" id="error" role="alert"></div></form></section><div class="foot">© 2026 ORVA Enterprise Business Platform</div></main><script>
const form=document.getElementById('form'),button=document.getElementById('submit'),error=document.getElementById('error');fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/');}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to sign in');location.replace('/');}catch(err){error.textContent=err.message;}finally{button.disabled=false;button.textContent='Sign in to ORVA';}});
</script></body></html>
