<!doctype html>
<html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17263d"><title>ORVA CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--surface2:#f8faff;--text:#202d42;--muted:#7d8ba0;--line:#e5eaf1;--nav:#172940;--navtext:#dbe4f0;--accent:#4263d6;--accent-soft:#edf1ff;--shadow:0 8px 28px #1c2d4410}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101722;--surface:#182333;--surface2:#1e2b3d;--text:#e8eef7;--muted:#9aabc0;--line:#2a3a50;--nav:#0c1522;--navtext:#dbe4f0;--accent:#91a7ff;--accent-soft:#293657;--shadow:0 8px 28px #0003}
@media(prefers-color-scheme:dark){:root[data-theme="system"]{color-scheme:dark;--bg:#101722;--surface:#182333;--surface2:#1e2b3d;--text:#e8eef7;--muted:#9aabc0;--line:#2a3a50;--nav:#0c1522;--navtext:#dbe4f0;--accent:#91a7ff;--accent-soft:#293657;--shadow:0 8px 28px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Manrope,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--nav);color:var(--navtext);display:flex;flex-direction:column;z-index:30;transition:transform .22s ease}.brand{height:68px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #ffffff19}.brand strong{font-size:25px;color:#fff;letter-spacing:-1.5px}.brand strong span{color:#8ea6ff}.module{margin:14px;padding:13px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff09}.module small{color:#a9b8cc;font-size:10px}.module b{display:block;color:white;margin:7px 0 3px}.menu-search{margin:0 14px 12px}.menu-search input{width:100%;padding:10px;border:1px solid #ffffff24;border-radius:8px;background:#ffffff0d;color:#fff;outline:none}.menu-search input::placeholder{color:#91a2b9}.nav{overflow:auto;flex:1;padding:0 10px 14px}.nav-label{padding:13px 10px 6px;color:#8295ae;font-size:9px;font-weight:800;letter-spacing:1.4px}.nav-group>button{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:8px;background:none;color:#c8d3e2;text-align:left;font-weight:700;font-size:11px}.nav-group>button:hover,.nav-group>button.active{background:#304765;color:white}.nav-group .chevron{margin-left:auto}.subnav{display:none;margin:2px 0 7px 20px;padding-left:9px;border-left:1px solid #ffffff2a}.nav-group.open .subnav{display:block}.subnav button{display:block;width:100%;padding:8px;border:0;border-radius:6px;background:none;color:#aebdd0;text-align:left;font-size:10px}.subnav button.active,.subnav button:hover{background:#ffffff14;color:#fff}.sidebar-bottom{padding:13px 17px;border-top:1px solid #ffffff1a;font-size:11px}.sidebar-bottom small{display:block;color:#8fa1b8;margin-top:3px}.main{min-height:100vh;margin-left:252px}.topbar{height:64px;position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}.menu-toggle,.close-sidebar{display:none}.breadcrumb{font-size:11px;color:var(--muted)}.breadcrumb b{color:var(--text)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.btn{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:9px 12px;font-size:10px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:#c34e5a}.theme-select{max-width:112px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}.content{max-width:1500px;margin:auto;padding:26px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.page-head h1{margin:0;font-size:24px;letter-spacing:-.8px}.muted{color:var(--muted);font-size:11px;margin-top:6px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}.metric-label{font-size:10px;color:var(--muted)}.metric-value{font-size:25px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;margin:13px 0}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:12px;font-weight:800}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:9px;overflow:auto}.stage{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.deal{padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:10px}.deal b{display:block;margin-bottom:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.field{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:10px;font-size:11px}.search-field{min-width:min(320px,100%);flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}th{color:var(--muted);font-size:9px}td{color:var(--text)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:9px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:60;background:#101b2d99;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}.dialog h2{margin:0 0 16px;font-size:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:10px;color:var(--muted)}.form-grid input,.form-grid select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.backdrop{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:12px 16px;border-radius:9px;background:#203653;color:white;font-size:11px;box-shadow:var(--shadow)}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{width:min(290px,86vw);transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}.close-sidebar,.menu-toggle{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid #ffffff2b;border-radius:8px;background:#ffffff0d;color:white;font-size:19px}.menu-toggle{background:none;color:var(--text);border-color:var(--line)}.backdrop.show{display:block;position:fixed;inset:0;z-index:25;background:#101b2d80}.main{margin-left:0}.topbar{padding:0 12px}.content{padding:18px 13px}.top-actions{gap:6px}.top-actions .avatar{display:none}.theme-select{max-width:98px;padding:8px 5px}.metrics{gap:8px}.card{padding:12px}.form-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="backdrop" id="backdrop"></div><aside class="sidebar" id="sidebar"><div class="brand"><strong>orva<span>.</span></strong><button class="close-sidebar" id="closeSidebar" aria-label="Close navigation">×</button></div><div class="module"><small>APPLICATION · CRM</small><b>Customer Relationship</b><small>Leads · Customers · Opportunities</small></div><div class="menu-search"><input id="menuSearch" placeholder="Search menu..."></div><nav class="nav" id="nav"></nav><div class="sidebar-bottom"><b id="profileName">ORVA User</b><small id="orgName">Workspace</small></div></aside>
<main class="main"><header class="topbar"><button class="menu-toggle" id="toggleSidebar" aria-label="Open navigation">☰</button><div class="breadcrumb">ORVA / CRM / <b id="crumb">Dashboard</b></div><div class="top-actions"><a class="btn" href="/" style="text-decoration:none">▦ App Launcher</a><select class="field theme-select" id="themeMode" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><div class="avatar" id="avatar">OR</div></div></header><section class="content" id="view"></section></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Create record</h2><form id="recordForm"><div class="form-grid" id="fields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save record</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),API='/api/crm/records';
const schema={
 leads:{label:'Leads',fields:[['name','Name'],['company','Company'],['email','Email'],['phone','Phone'],['source','Source'],['status','Status'],['owner','Owner']]},
 customers:{label:'Customers',fields:[['name','Name'],['type','Type'],['category','Category'],['group','Group'],['email','Email'],['phone','Phone'],['website','Website']]},
 contacts:{label:'Contacts',fields:[['name','Name'],['company','Company'],['job_title','Job Title'],['email','Email'],['phone','Phone'],['owner','Owner']]},
 opportunities:{label:'Opportunities',fields:[['name','Name'],['customer','Customer'],['value','Value'],['stage','Stage'],['probability','Probability'],['expected_close','Expected Close'],['owner','Owner']]},
 activities:{label:'Activities',fields:[['subject','Subject'],['type','Type'],['related_to','Related To'],['due_date','Due Date'],['time','Time'],['owner','Owner'],['status','Status']]},
 lead_sources:{label:'Lead Sources',fields:[['name','Name'],['description','Description'],['active','Active']]},
 pipeline_stages:{label:'Pipeline Stages',fields:[['name','Name'],['probability','Probability'],['sequence','Sequence'],['active','Active']]},
 activity_types:{label:'Activity Types',fields:[['name','Name'],['description','Description'],['active','Active']]},
 lost_reasons:{label:'Lost Reasons',fields:[['name','Name'],['description','Description'],['active','Active']]},
 sales_teams:{label:'Sales Teams',fields:[['name','Name'],['manager','Manager'],['members','Members'],['target','Target'],['active','Active']]}
};
const menus=[['CRM WORKSPACE',[['Dashboard','▦',['CRM Overview']],['Leads','♧',['All Leads']],['Customers','♙',['All Customers']],['Contacts','♧',['All Contacts']],['Opportunities','◈',['All Opportunities']],['Activities','◷',['All Activities']],['Sales Forecast','⌁',['Sales Forecast']]]],['ADMINISTRATION',[['Configuration','⚙',['Lead Sources','Pipeline Stages','Activity Types','Lost Reasons','Sales Teams']]]]];
const routeMap={'CRM Overview':'/crm/dashboard','All Leads':'/crm/leads','All Customers':'/crm/customers','All Contacts':'/crm/contacts','All Opportunities':'/crm/opportunities','All Activities':'/crm/activities','Sales Forecast':'/crm/forecast','Lead Sources':'/crm/config/lead-sources','Pipeline Stages':'/crm/config/pipeline-stages','Activity Types':'/crm/config/activity-types','Lost Reasons':'/crm/config/lost-reasons','Sales Teams':'/crm/config/sales-teams'};
const routeToPage=Object.fromEntries(Object.entries(routeMap).map(([k,v])=>[v,k]));
function pageFromLocation(){const p=location.pathname.replace(/\\/$/,'')||'/crm';return routeToPage[p]||'CRM Overview'}
let page=pageFromLocation(),rows={},editing=null,sessionUser=null,searchTerm='',pageNumber=1,pageSize=25,totalRecords=0,totalPages=1,activeFilter='all',sortField='created_at',sortDirection='desc',requestSequence=0;
const typeForPage=p=>p==='CRM Overview'||p==='Sales Forecast'?'':p==='All Leads'?'leads':p==='All Customers'?'customers':p==='All Contacts'?'contacts':p==='All Opportunities'?'opportunities':p==='All Activities'?'activities':p==='Lead Sources'?'lead_sources':p==='Pipeline Stages'?'pipeline_stages':p==='Activity Types'?'activity_types':p==='Lost Reasons'?'lost_reasons':'sales_teams';
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem('orva.theme',v);$('#themeMode').value=v}
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.href='/login';throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(type){const seq=++requestSequence,params=new URLSearchParams({entity:type,page:String(pageNumber),limit:String(pageSize),sort:sortField,direction:sortDirection});if(searchTerm)params.set('q',searchTerm);if(activeFilter==='my')params.set('owner',sessionUser?.full_name||'');if(activeFilter==='unassigned')params.set('owner','Unassigned');if(activeFilter==='new')params.set('status','New');if(activeFilter==='qualified')params.set('status','Qualified');if(activeFilter==='lost')params.set(type==='opportunities'?'stage':'status','Lost');if(activeFilter==='won')params.set('stage','Won');if(activeFilter==='scheduled')params.set('status','Scheduled');if(activeFilter==='calls'||activeFilter==='meetings'||activeFilter==='emails')params.set('activity_type',activeFilter.slice(0,-1));const d=await api(API+'?'+params.toString());if(seq!==requestSequence)return rows[type]||[];rows[type]=d.data||[];totalRecords=d.pagination?.total||0;totalPages=d.pagination?.total_pages||1;return rows[type]}
async function saveRecord(type,data){const url=editing?API+'/'+editing:API;const d=await api(url,{method:editing?'PUT':'POST',body:JSON.stringify(editing?{data}:{entity:type,data})});return d.data}
async function deleteRecord(id){await api(API+'/'+id,{method:'DELETE'})}
function nav(){let h='';menus.forEach(([title,groups])=>{h+='<div class="nav-label">'+title+'</div>';groups.forEach(([name,icon,subs])=>{const open=subs.includes(page);h+='<div class="nav-group '+(open?'open':'')+'"><button class="'+(open?'active':'')+'" data-group><span>'+icon+'</span>'+name+'<span class="chevron">›</span></button><div class="subnav">'+subs.map(x=>'<button data-page="'+esc(x)+'" class="'+(x===page?'active':'')+'">'+esc(x)+'</button>').join('')+'</div></div>'})});$('#nav').innerHTML=h}
function navigate(next,replace=false){page=next;pageNumber=1;searchTerm='';activeFilter='all';const url=routeMap[next]||'/crm/dashboard';history[replace?'replaceState':'pushState']({page:next},'',url);nav();closeSidebar();render()}

function metric(label,value){return '<div class="card"><div class="metric-label">'+label+'</div><div class="metric-value">'+value+'</div></div>'}
function head(title,desc,action=''){return '<div class="page-head"><div><h1>'+esc(title)+'</h1><div class="muted">'+esc(desc)+'</div></div>'+action+'</div>'}
function dashboard(){const leads=rows.leads||[],customers=rows.customers||[],opps=rows.opportunities||[],acts=rows.activities||[],open=opps.filter(r=>!['Won','Lost'].includes(r.data.stage)),sum=open.reduce((n,r)=>n+(Number(r.data.value)||0),0);return head('CRM Overview','Customer relationships and sales performance.','<button class="btn primary" data-create="leads">＋ Add Lead</button>')+'<div class="metrics">'+metric('Total Leads',leads.length)+metric('Customers',customers.length)+metric('Open Opportunities',open.length)+metric('Pipeline Value','$'+sum.toLocaleString())+'</div><div class="grid"><div class="card"><div class="card-title">Sales Pipeline <span class="muted">'+open.length+' open deals</span></div><div class="pipeline">'+['New','Qualified','Proposal','Negotiation','Closing'].map(s=>'<div class="stage"><b>'+s+'</b>'+open.filter(r=>r.data.stage===s).map(r=>'<div class="deal"><b>'+esc(r.data.name)+'</b><span class="muted">'+esc(r.data.customer)+' · $'+Number(r.data.value||0).toLocaleString()+'</span></div>').join('')+'</div>').join('')+'</div></div><div class="card"><div class="card-title">Upcoming Activities</div>'+acts.slice(0,6).map(r=>'<p><b>'+esc(r.data.subject)+'</b><div class="muted">'+esc(r.data.related_to)+' · '+esc(r.data.due_date)+'</div></p>').join('')+'</div></div>'}
function filterRows(type){let data=rows[type]||[],p=page;if(p==='My Leads'||p==='My Opportunities')data=data.filter(r=>r.data.owner===sessionUser?.full_name);if(p==='Unassigned Leads')data=data.filter(r=>!r.data.owner||r.data.owner==='Unassigned');if(p==='New Leads')data=data.filter(r=>String(r.data.status).toLowerCase()==='new');if(p==='Qualified Leads')data=data.filter(r=>String(r.data.status).toLowerCase()==='qualified');if(p==='Lost Leads'||p==='Lost Opportunities')data=data.filter(r=>String(r.data.status||r.data.stage).toLowerCase()==='lost');if(p==='Won Opportunities')data=data.filter(r=>String(r.data.stage).toLowerCase()==='won');if(p==='Companies')data=data.filter(r=>r.data.type==='Company');if(p==='Individual Customers')data=data.filter(r=>r.data.type==='Individual');if(p==='Scheduled Activities')data=data.filter(r=>r.data.status==='Scheduled');if(p==='Overdue Activities')data=data.filter(r=>r.data.status==='Overdue');if(['Calls','Meetings','Emails'].includes(p))data=data.filter(r=>r.data.type===p.slice(0,-1)||r.data.type===p);if(searchTerm)data=data.filter(r=>JSON.stringify(r.data).toLowerCase().includes(searchTerm));return data}
function tablePage(type){const meta=schema[type],data=filterRows(type);if(type==='opportunities'&&page==='Kanban View')return head(page,'Track opportunities by stage.')+'<div class="pipeline">'+['New','Qualified','Proposal','Negotiation','Closing','Won','Lost'].map(s=>'<div class="stage"><b>'+s+'</b>'+data.filter(r=>r.data.stage===s).map(r=>'<div class="deal"><b>'+esc(r.data.name)+'</b><span class="muted">'+esc(r.data.customer)+' · $'+Number(r.data.value||0).toLocaleString()+'</span></div>').join('')+'</div>').join('')+'</div>';const action='<button class="btn primary" data-create="'+type+'">＋ Add '+meta.label.slice(0,-1)+'</button>';return head(page,'Manage '+meta.label.toLowerCase()+' records.',action)+'<div class="toolbar"><input class="field search-field" id="recordSearch" placeholder="Search records..." value="'+esc(searchTerm)+'"><button class="btn" id="exportCsv">↓ Export CSV</button><button class="btn" id="refresh">↻ Refresh</button></div><div class="card"><div class="card-title">'+esc(page)+' <span class="muted">'+data.length+' records</span></div><div class="table-wrap"><table><thead><tr>'+meta.fields.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+data.map(r=>'<tr>'+meta.fields.map(([k])=>'<td>'+esc(r.data[k]??'')+'</td>').join('')+'<td><button class="btn" data-edit="'+r.id+'" data-type="'+type+'">Edit</button> <button class="btn danger" data-delete="'+r.id+'">Delete</button></td></tr>').join('')+'</tbody></table>'+(data.length?'':'<div class="empty">No records yet. Add your first record.</div>')+'</div></div>'}
async function render(){const type=typeForPage(page);$('#crumb').textContent=page;try{if(['CRM Overview','Lead Statistics','Opportunity Statistics','Sales Pipeline','Conversion Rate','Sales Forecast','Forecast Overview','Forecast by Salesperson','Forecast by Team','Forecast by Period'].includes(page)){await Promise.all(['leads','customers','opportunities','activities'].map(load));$('#view').innerHTML=page.includes('Forecast')?head(page,'Forecast based on current opportunity records.')+'<div class="metrics">'+metric('Open Pipeline','$'+(rows.opportunities||[]).filter(r=>!['Won','Lost'].includes(r.data.stage)).reduce((n,r)=>n+(Number(r.data.value)||0),0).toLocaleString())+metric('Won Deals',(rows.opportunities||[]).filter(r=>r.data.stage==='Won').length)+metric('Open Deals',(rows.opportunities||[]).filter(r=>!['Won','Lost'].includes(r.data.stage)).length)+'</div>':dashboard()}else{await load(type);$('#view').innerHTML=tablePage(type)}bind()}catch(e){$('#view').innerHTML=head(page,'Unable to load this workspace.')+'<div class="card empty">'+esc(e.message)+' <button class="btn" id="retry">Retry</button></div>';$('#retry')?.addEventListener('click',render)}}
function openForm(type,id){editing=id||null;const meta=schema[type],record=id?(rows[type]||[]).find(r=>r.id===id):null;$('#modalTitle').textContent=(record?'Edit ':'Create ')+meta.label.slice(0,-1);$('#fields').innerHTML=meta.fields.map(([key,label])=>'<label>'+esc(label)+'<input name="'+key+'" value="'+esc(record?.data[key]??'')+'" '+(key==='name'||key==='subject'?'required':'')+'></label>').join('');$('#recordForm').dataset.type=type;$('#modal').classList.add('show')}
function exportCsv(type){const meta=schema[type],data=filterRows(type),lines=[meta.fields.map(x=>x[1]),...data.map(r=>meta.fields.map(([k])=>r.data[k]??''))],csv=lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=type+'.csv';a.click();URL.revokeObjectURL(url)}
function bind(){$('[data-create]')?.addEventListener('click',e=>openForm(e.currentTarget.dataset.create));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.type,b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this record?'))try{await deleteRecord(b.dataset.delete);toast('Record deleted');await render()}catch(e){toast(e.message)}});$('#recordSearch')?.addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase();const pos=e.target.selectionStart;const type=typeForPage(page);$('#view').innerHTML=tablePage(type);bind();$('#recordSearch').focus();$('#recordSearch').setSelectionRange(pos,pos)});$('#exportCsv')?.addEventListener('click',()=>exportCsv(typeForPage(page)));$('#refresh')?.addEventListener('click',render)}
$('#recordForm').onsubmit=async e=>{e.preventDefault();const type=e.target.dataset.type,data=Object.fromEntries(new FormData(e.target).entries());for(const k of ['value','probability','target','sequence'])if(data[k]!=='')data[k]=Number(data[k]);try{await saveRecord(type,data);$('#modal').classList.remove('show');toast('Record saved to database');editing=null;await render()}catch(err){toast(err.message)}};$('#cancel').onclick=()=>$('#modal').classList.remove('show');
function closeSidebar(){$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show')}function toggleSidebar(){const opened=$('#sidebar').classList.toggle('open');$('#backdrop').classList.toggle('show',opened)}
$('#toggleSidebar').onclick=toggleSidebar;$('#closeSidebar').onclick=closeSidebar;$('#backdrop').onclick=closeSidebar;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSidebar();$('#modal').classList.remove('show')}});
$('#nav').onclick=e=>{const p=e.target.closest('[data-page]'),g=e.target.closest('[data-group]');if(p){page=p.dataset.page;searchTerm='';nav();closeSidebar();render()}else if(g){g.parentElement.classList.toggle('open');g.classList.toggle('active')}};
$('#menuSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.nav-group').forEach(g=>{const match=g.textContent.toLowerCase().includes(q);g.hidden=!!q&&!match;if(q&&match)g.classList.add('open')})};
$('#themeMode').onchange=e=>theme(e.target.value);
(async()=>{theme(localStorage.getItem('orva.theme')||'system');try{const me=await api('/api/auth/me');sessionUser=me.user;$('#profileName').textContent=me.user.full_name;$('#orgName').textContent=me.organization.name;$('#avatar').textContent=me.user.full_name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();nav();await render()}catch(e){toast(e.message)}})();
</script></body></html>
