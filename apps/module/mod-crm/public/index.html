<html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17263d"><title>ORVA CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

ms:center;gap:12px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}.menu-toggle,.close-sidebar{display:none}.breadcrumb{font-size:11px;color:var(--muted)}.breadcrumb b{color:var(--text)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.btn{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:9px 12px;font-size:10px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:#c34e5a}.theme-select{max-width:112px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800}.content{max-width:1500px;margin:auto;padding:26px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.page-head h1{margin:0;font-size:24px;letter-spacing:-.8px}.muted{color:var(--muted);font-size:11px;margin-top:6px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}.metric-label{font-size:10px;color:var(--muted)}.metric-value{font-size:25px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;margin:13px 0}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:12px;font-weight:800}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:9px;overflow:auto}.stage{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.deal{padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:10px}.deal b{display:block;margin-bottom:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.field{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:10px;font-size:11px}.search-field{min-width:min(320px,100%);flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:10px}th{color:var(--muted);font-size:9px}td{color:var(--text)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:9px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:60;background:#101b2d99;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}.dialog h2{margin:0 0 16px;font-size:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:10px;color:var(--muted);position:relative}.form-grid input,.form-grid select,.form-grid textarea{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);outline:none}.form-grid input:focus,.form-grid select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.form-grid input::placeholder{color:var(--muted);opacity:.8}.combo{position:relative}.combo-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:75;max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.combo.open .combo-menu{display:block}.combo-option{display:block;width:100%;padding:10px 12px;border:0;background:none;color:var(--text);text-align:left;font-size:11px}.combo-option:hover,.combo-option:focus{background:var(--accent-soft)}.combo-empty{padding:12px;color:var(--muted);font-size:10px}.field-hint{display:block;margin-top:5px;color:var(--muted);font-size:9px}.dialog-acti @media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{width:min(290px,86vw);transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}.close-sidebar,.menu-toggle{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid #ffffff2b;border-radius:8px;background:#ffffff0d;color:white;font-size:19px}.menu-toggle{background:none;color:var(--text);border-color:var(--line)}.backdrop.show{display:block;position:fixed;inset:0;z-index:25;background:#101b2d80}.main{margin-left:0}.topbar{padding:0 12px}.content{padding:18px 13px}.top-actions{gap:6px}.top-actions .avatar{display:none}.theme-select{max-width:98px;padding:8px 5px}.metrics{gap:8px}.card{padding:12px}.form-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="backdrop" id="backdrop"></div><aside class="sidebar" id="sidebar"><div class="brand"><strong>orva<span>.</span></strong><button class="close-sidebar" id="closeSidebar" aria-label="Close navigation">×</button></div><div class="module"><small>APPLICATION · CRM</small><b>Customer Relationship</b><small>Leads · Customers · Opportunities</small></div><div class="menu-search"><input id="menuSearch" placeholder="Search menu..."></div><nav class="nav" id="nav"></nav><div class="sidebar-bottom"><b id="profileName">ORVA User</b><small id="orgName">Workspace</small></div></aside>
<main class="main"><header class="topbar"><button class="menu-toggle" id="toggleSidebar" aria-label="Open navigation">☰</button><div class="breadcrumb">ORVA / CRM / <b id="crumb">Dashboard</b></div><div class="top-actions"><a class="btn" href="/" style="text-decoration:none">▦ App Launcher</a><select class="field theme-select" id="themeMode" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><div class="avatar" id="avatar">OR</div></div></header><section class="content" id="view"></section></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Create record</h2><form id="recordForm"><div class="form-grid" id="fields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save record</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),API='/api/crm/records';
const schema={
 leads:{label:'Leads',fields:[['name','Lead Name','text','Enter lead name'],['company','Company','text','Enter company name'],['email','Email','email','name@company.com'],['phone','Phone','tel','+62...'],['source','Lead Source','lookup:lead_sources','Search lead sources'],['status','Status','select:New|Contacted|Qualified|Unqualified|Lost','Select lead status'],['owner','Lead Owner','lookup:users','Search users by name or email']]},
 customers:{label:'Customers',fields:[['name','Customer Name','text','Enter customer or company name'],['type','Customer Type','select:Company|Individual','Select customer type'],['category','Category','text','e.g. Strategic, Enterprise'],['group','Customer Group','text','Enter customer group'],['email','Email','email','name@company.com'],['phone','Phone','tel','+62...'],['website','Website','url','https://example.com']]},
 contacts:{label:'Contacts',fields:[['name','Contact Name','text','Enter full name'],['company','Customer','lookup:customers','Search customers'],['job_title','Job Title','text','e.g. Procurement Manager'],['email','Email','email','name@company.com'],['phone','Phone','tel','+62...'],['owner','Contact Owner','lookup:users','Search users by name or email']]},
 opportunities:{label:'Opportunities',fields:[['name','Opportunity Name','text','Enter opportunity name'],['customer','Customer','lookup:customers','Search customers'],['value','Opportunity Value','number','0'],['stage','Pipeline Stage','lookup:pipeline_stages','Search pipeline stages'],['probability','Probability (%)','number','0–100'],['expected_close','Expected Close Date','date',''],['owner','Opportunity Owner','lookup:users','Search users by name or email'],['lost_reason','Lost Reason','lookup:lost_reasons','Select a reason when the opportunity is lost']]},
 activities:{label:'Activities',fields:[['subject','Subject','text','Enter activity subject'],['type','Activity Type','lookup:activity_types','Search activity types'],['related_to','Related Record','lookup:related','Search leads, customers, contacts or opportunities'],['due_date','Due Date','date',''],['time','Time','time',''],['owner','Assigned To','lookup:users','Search users by name or email'],['status','Status','select:Planned|Scheduled|Completed|Cancelled','Select activity status']]},
 lead_sources:{label:'Lead Sources',fields:[['name','Source Name','text','e.g. Website, Referral'],['description','Description','text','Describe this lead source'],['active','Active','select:Yes|No','Select status']]},
 pipeline_stages:{label:'Pipeline Stages',fields:[['name','Stage Name','text','e.g. Qualification'],['probability','Default Probability (%)','number','0–100'],['sequence','Display Order','number','1'],['active','Active','select:Yes|No','Select status']]},
 activity_types:{label:'Activity Types',fields:[['name','Activity Type','text','e.g. Call, Meeting, Email'],['description','Description','text','Describe this activity type'],['active','Active','select:Yes|No','Select status']]},
 lost_reasons:{label:'Lost Reasons',fields:[['name','Reason','text','e.g. Budget, Competitor'],['description','Description','text','Describe the reason'],['active','Active','select:Yes|No','Select status']]},
 sales_teams:{label:'Sales Teams',fields:[['name','Team Name','text','Enter team name'],['manager','Team Manager','lookup:users','Search team manager'],['members','Team Members','text','Enter member names'],['target','Sales Target','number','0'],['active','Active','select:Yes|No','Select status']]},
 activity_plans:{label:'Activity Plans (SOP)',fields:[['name','Plan Name','text','e.g. Enterprise Client Onboarding SOP'],['trigger','Trigger','select:Lead Created|Lead Qualified|Opportunity Created|Stage Changed','Select when this plan starts'],['description','Description','text','Describe the follow-up sequence'],['active','Active','select:Yes|No','Select status']]},
 opportunity_tags:{label:'Opportunity Tags',fields:[['name','Tag Name','text','e.g. Enterprise, Software, VIP'],['color','Hex Color','text','#0d9488'],['description','Description','text','Describe this tag'],['active','Active','select:Yes|No','Select status']]},
 lead_mining_requests:{label:'Lead Mining Requests',fields:[['name','Request Name','text','Enter request name'],['country','Target Country','text','e.g. Indonesia'],['industry','Industry','text','e.g. Oil & Gas'],['company_size','Company Size','select:1–10|11–50|51–200|201–500|501–1000|1000+','Select company size'],['target_roles','Target Roles','text','e.g. Procurement Manager, Operations Director'],['status','Status','select:Draft|Queued|Processing|Completed|Failed|Cancelled','Select request status']]}
};
const menus=[['CRM WORKSPACE',[['CRM Overview','▦','CRM Overview'],['Leads','♧',['All Leads','Lead Mining Requests']],['Customers','♙',['All Customers','All Contacts']],['Opportunities','◈',['All Opportunities','Opportunity Kanban','Sales Forecast']],['Activities','◷',['All Activities','Activity Plans (SOP)']],['Reporting & Analytics','⌁','Reporting & Analytics']]],['CONFIGURATION',[['Pipeline','◫',['Pipeline Stages','Opportunity Tags','Lost Reasons']],['Sales Organization','♙','Sales Teams'],['Activity Configuration','◷',['Activity Types','Lead Sources']]]]];
const routeMap={'CRM Overview':'/crm/dashboard','Opportunity Kanban':'/crm/opportunities/kanban','All Leads':'/crm/leads','Lead Mining Requests':'/crm/lead-mining','All Customers':'/crm/customers','All Contacts':'/crm/contacts','All Opportunities':'/crm/opportunities','Sales Forecast':'/crm/forecast','All Activities':'/crm/activities','Activity Plans (SOP)':'/crm/activity-plans','Reporting & Analytics':'/crm/reporting','Lead Sources':'/crm/config/lead-sources','Pipeline Stages':'/crm/config/pipeline-stages','Opportunity Tags':'/crm/config/opportunity-tags','Activity Types':'/crm/config/activity-types','Lost Reasons':'/crm/config/lost-reasons','Sales Teams':'/crm/config/sales-teams'};
const routeToPage=Object.fromEntries(Object.entries(routeMap).map(([k,v])=>[v,k]));
function pageFromLocation(){const p=location.pathname.replace(/\/$/,'')||'/crm';return routeToPage[p]||'CRM Overview'}
let page=pageFromLocation(),rows={},editing=null,sessionUser=null,searchTerm='',pageNumber=1,pageSize=25,totalRecords=0,totalPages=1,activeFilter='all',sortField='created_at',sortDirection='desc',requestSequence={};
const typeForPage=p=>['CRM Overview','Opportunity Kanban','Sales Forecast','Reporting & Analytics'].includes(p)?'':p==='All Leads'?'leads':p==='All Customers'?'customers':p==='All Contacts'?'contacts':p==='All Opportunities'?'opportunities':p==='All Activities'?'activities':p==='Lead Sources'?'lead_sources':p==='Pipeline Stages'?'pipeline_stages':p==='Activity Types'?'activity_types':p==='Lost Reasons'?'lost_reasons':p==='Sales Teams'?'sales_teams':p==='Activity Plans (SOP)'?'activity_plans':p==='Opportunity Tags'?'opportunity_tags':'lead_mining_requests';
function theme(v){document.documentElement.dataset.theme=v;localStorage.setItem('orva.theme',v);$('#themeMode').value=v}
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.href='/login';throw Error('Session expired')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(type){const seq=requestSequence[type]=(requestSequence[type]||0)+1,params=new URLSearchParams({entity:type,page:String(pageNumber),limit:String(pageSize),sort:sortField,direction:sortDirection});if(searchTerm)params.set('q',searchTerm);if(activeFilter==='my')params.set('owner',sessionUser?.id||'');if(activeFilter==='unassigned')params.set('owner','Unassigned');if(activeFilter==='new')params.set('status','New');if(activeFilter==='qualified')params.set('status','Qualified');if(activeFilter==='lost')params.set(type==='opportunities'?'stage':'status','Lost');if(activeFilter==='won')params.set('stage','Won');if(activeFilter==='scheduled')params.set('status','Scheduled');if(activeFilter==='calls'||activeFilter==='meetings'||activeFilter==='emails')params.set('activity_type',activeFilter.slice(0,-1));const d=await api(API+'?'+params.toString());if(seq!==requestSequence[type])return rows[type]||[];rows[type]=d.data||[];totalRecords=d.pagination?.total||0;totalPages=d.pagination?.total_pages||1;return rows[type]}
async function saveRecord(type,data){const url=editing?API+'/'+editing:API;const d=await api(url,{method:editing?'PUT':'POST',body:JSON.stringify(editing?{data}:{entity:type,data})});return d.data}
async function deleteRecord(id){await api(API+'/'+id,{method:'DELETE'})}
function nav(){let h='';menus.forEach(([title,groups])=>{h+='<div class="nav-label">'+title+'</div>';groups.forEach(([name,icon,target])=>{if(Array.isArray(target)&&target.length===1){const direct=target[0];h+='<div class="nav-group"><button class="'+(direct===page?'active':'')+'" data-page="'+esc(direct)+'"><span>'+icon+'</span>'+esc(direct)+'</button></div>'}else if(Array.isArray(target)){const open=target.includes(page);h+='<div class="nav-group '+(open?'open':'')+'"><button class="'+(open?'active':'')+'" data-group><span>'+icon+'</span>'+esc(name)+'<span class="chevron">›</span></button><div class="subnav">'+target.map(x=>'<button data-page="'+esc(x)+'" class="'+(x===page?'active':'')+'">'+esc(x)+'</button>').join('')+'</div></div>'}else h+='<div class="nav-group"><button class="'+(target===page?'active':'')+'" data-page="'+esc(target)+'"><span>'+icon+'</span>'+esc(name)+'</button></div>'})});$('#nav').innerHTML=h}
function navigate(next,replace=false){page=next;pageNumber=1;searchTerm='';activeFilter='all';const url=routeMap[next]||'/crm/dashboard';history[replace?'replaceState':'pushState']({page:next},'',url);nav();closeSidebar();render()}

function metric(label,value){return '<div class="card"><div class="metric-label">'+label+'</div><div class="metric-value">'+value+'</div></div>'}
function head(title,desc,action=''){return '<div class="page-head"><div><h1>'+esc(title)+'</h1><div class="muted">'+esc(desc)+'</div></div>'+action+'</div>'}
function dashboard(){const leads=rows.leads||[],customers=rows.customers||[],opps=rows.opportunities||[],acts=rows.activities||[],open=opps.filter(r=>!['Won','Lost'].includes(r.data.stage)),sum=open.reduce((n,r)=>n+(Number(r.data.value)||0),0);return head('CRM Overview','Customer relationships and sales performance.','<button class="btn primary" data-create="leads">＋ Add Lead</button>')+'<div class="metrics">'+metric('Total Leads',leads.length)+metric('Customers',customers.length)+metric('Open Opportunities',open.length)+metric('Pipeline Value','Rp '+sum.toLocaleString('id-ID'))+'</div><div class="grid"><div class="card"><div class="card-title">Sales Pipeline <span class="muted">'+open.length+' open deals</span></div><div class="pipeline">'+['New','Qualified','Proposal','Negotiation','Closing'].map(s=>'<div class="stage"><b>'+s+'</b>'+open.filter(r=>r.data.stage===s).map(r=>'<div class="deal"><b>'+esc(r.data.name)+'</b><span class="muted">'+esc(r.data.customer)+' · $'+Number(r.data.value||0).toLocaleString()+'</span></div>').join('')+'</div>').join('')+'</div></div><div class="card"><div class="card-title">Upcoming Activities</div>'+acts.slice(0,6).map(r=>'<p><b>'+esc(r.data.subject)+'</b><div class="muted">'+esc(r.data.related_to)+' · '+esc(r.data.due_date)+'</div></p>').join('')+'</div></div>'}
function opportunityKanbanPage(){const stages=(rows.pipeline_stages||[]).slice().sort((a,b)=>(Number(a.data.sequence)||0)-(Number(b.data.sequence)||0));const deals=rows.opportunities||[];const configured=stages.map(x=>x.data.name),columns=[...new Set([...(configured.length?configured:['New','Qualified','Proposal','Negotiation','Closing']),'Won','Lost'])];return head('Opportunity Pipeline','Drag opportunities between stages to update the sales pipeline.','<button class="btn" data-page="All Opportunities">☷ List View</button> <button class="btn primary" data-create="opportunities">＋ Add Opportunity</button>')+'<div class="toolbar"><span class="muted">'+deals.length+' opportunities · drag and drop to change stage</span><button class="btn" id="refresh">↻ Refresh</button></div><div class="pipeline kanban-board">'+columns.map(stage=>{const items=deals.filter(r=>(r.data.stage||'New')===stage);const total=items.reduce((n,r)=>n+(Number(r.data.value)||0),0);return '<section class="stage kanban-column" data-stage="'+esc(stage)+'"><div class="card-title">'+esc(stage)+' <span class="pill">'+items.length+'</span></div><div class="muted">Rp '+total.toLocaleString('id-ID')+'</div>'+(items.length?items.map(r=>'<article class="deal kanban-deal" draggable="true" data-id="'+r.id+'"><b>'+esc(r.data.name)+'</b><div class="muted">'+esc(r.data.customer||'No customer')+'</div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:9px"><strong>Rp '+Number(r.data.value||0).toLocaleString('id-ID')+'</strong><span class="muted">'+Number(r.data.probability||0)+'%</span></div><button class="btn" style="margin-top:8px" data-edit="'+r.id+'" data-type="opportunities">Open</button></article>').join(''):'<div class="empty">No opportunities</div>')+'</section>'}).join('')+'</div>'}
function reportingPage(){const opps=rows.opportunities||[],open=opps.filter(r=>!['Won','Lost'].includes(r.data.stage)),won=opps.filter(r=>r.data.stage==='Won'),lost=opps.filter(r=>r.data.stage==='Lost'),total=opps.reduce((n,r)=>n+(Number(r.data.value)||0),0),weighted=open.reduce((n,r)=>n+(Number(r.data.value)||0)*(Number(r.data.probability)||0)/100,0),rate=(won.length+lost.length)?Math.round(won.length/(won.length+lost.length)*100):0;const stages=[...new Set(opps.map(r=>r.data.stage).filter(Boolean))];return head('Reporting & Analytics','Sales performance calculated from the current CRM opportunity records.')+'<div class="metrics">'+metric('Total Pipeline','Rp '+total.toLocaleString('id-ID'))+metric('Open Opportunities',open.length)+metric('Weighted Forecast','Rp '+weighted.toLocaleString('id-ID'))+metric('Win Rate',rate+'%')+'</div><div class="card"><div class="card-title">Pipeline Stage Breakdown</div>'+stages.map(stage=>{const list=opps.filter(r=>r.data.stage===stage),value=list.reduce((n,r)=>n+(Number(r.data.value)||0),0),width=total?Math.round(value/total*100):0;return '<div style="display:grid;grid-template-columns:110px 1fr 130px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(stage)+'</b><div style="height:9px;background:var(--surface2);border-radius:9px;overflow:hidden"><div style="height:100%;width:'+width+'%;background:var(--accent)"></div></div><span>Rp '+value.toLocaleString('id-ID')+' ('+list.length+')</span></div>'}).join('')||'<div class="empty">Belum ada data pipeline.</div>'+'</div><div class="grid"><div class="card">Won: <b>'+won.length+'</b></div><div class="card">Lost: <b>'+lost.length+'</b></div></div>'}
function filterRows(type){return rows[type]||[]}
function filterOptions(type){const opts=[['all','All records']];if(type==='leads')opts.push(['my','My leads'],['unassigned','Unassigned'],['new','New'],['qualified','Qualified'],['lost','Lost']);if(type==='opportunities')opts.push(['my','My opportunities'],['won','Won'],['lost','Lost']);if(type==='activities')opts.push(['calls','Calls'],['meetings','Meetings'],['emails','Emails'],['scheduled','Scheduled']);return opts}
function tablePage(type){const meta=schema[type],data=filterRows(type),opts=filterOptions(type);const action=(type==='opportunities'?'<button class="btn" data-page="Opportunity Kanban">▦ Kanban</button> ':'')+'<button class="btn primary" data-create="'+type+'">＋ Add '+meta.label.replace(/s$/,'')+'</button>';return head(page,'Manage '+meta.label.toLowerCase()+' records.',action)+'<div class="toolbar"><input class="field search-field" id="recordSearch" type="search" autocomplete="off" placeholder="Search all '+meta.label.toLowerCase()+'..." value="'+esc(searchTerm)+'"><select class="field" id="recordFilter">'+opts.map(([v,l])=>'<option value="'+v+'" '+(activeFilter===v?'selected':'')+'>'+l+'</option>').join('')+'</select><select class="field" id="pageSize"><option value="25" '+(pageSize===25?'selected':'')+'>25 rows</option><option value="50" '+(pageSize===50?'selected':'')+'>50 rows</option><option value="100" '+(pageSize===100?'selected':'')+'>100 rows</option></select><button class="btn" id="exportCsv">↓ Export page CSV</button><button class="btn" id="refresh">↻ Refresh</button></div><div class="card"><div class="card-title">'+esc(page)+' <span class="muted">'+totalRecords.toLocaleString()+' total records</span></div><div class="table-wrap"><table><thead><tr>'+meta.fields.map(([key,label])=>'<th><button class="sort-button" data-sort="'+key+'" style="border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer">'+esc(label)+(sortField===key?(sortDirection==='asc'?' ↑':' ↓'):'')+'</button></th>').join('')+'<th>Actions</th></tr></thead><tbody>'+data.map(r=>'<tr>'+meta.fields.map(([k])=>'<td>'+esc(r.data[k]??'')+'</td>').join('')+'<td><button class="btn" data-timeline="'+r.id+'" data-record="'+esc(r.data.name||r.data.subject||type)+'">Timeline</button> <button class="btn" data-edit="'+r.id+'" data-type="'+type+'">Edit</button> '+(type==='leads'?(r.data.status==='Converted'?'<span class="pill">Converted</span>':'<button class="btn" data-convert="'+r.id+'">Convert</button> '):'')+'<button class="btn danger" data-delete="'+r.id+'">Delete</button></td></tr>').join('')+'</tbody></table>'+(data.length?'':'<div class="empty">No records found. Adjust your filters or add a record.</div>')+'</div><div class="toolbar" style="justify-content:space-between;align-items:center;margin-bottom:0"><span class="muted">Page '+pageNumber+' of '+Math.max(1,totalPages)+' · '+totalRecords.toLocaleString()+' records</span><div style="display:flex;gap:7px"><button class="btn" id="prevPage" '+(pageNumber<=1?'disabled':'')+'>← Previous</button><button class="btn" id="nextPage" '+(pageNumber>=totalPages?'disabled':'')+'>Next →</button></div></div></div>'}
async function render(){const type=typeForPage(page);$('#crumb').textContent=page;try{if(!type){await Promise.all(['leads','customers','opportunities','activities',...(page==='Opportunity Kanban'?['pipeline_stages']:[])].map(load));if(page==='Opportunity Kanban'){$('#view').innerHTML=opportunityKanbanPage()}else if(page==='Sales Forecast'){const open=(rows.opportunities||[]).filter(r=>!['Won','Lost'].includes(r.data.stage));$('#view').innerHTML=head(page,'Forecast based on current opportunity records.')+'<div class="metrics">'+metric('Open pipeline value','Rp '+open.reduce((n,r)=>n+(Number(r.data.value)||0),0).toLocaleString('id-ID'))+metric('Open opportunities',open.length)+metric('Won deals',(rows.opportunities||[]).filter(r=>r.data.stage==='Won').length)+'</div>'}else if(page==='Reporting & Analytics'){$('#view').innerHTML=reportingPage()}else $('#view').innerHTML=dashboard()}else{await load(type);$('#view').innerHTML=tablePage(type)}bind()}catch(e){$('#view').innerHTML=head(page,'Unable to load this workspace.')+'<div class="card empty">'+esc(e.message)+' <button class="btn" id="retry">Retry</button></div>';$('#retry')?.addEventListener('click',render)}}
function lookupIdKey(key){return ({source:'source_id',owner:'owner_id',manager:'manager_id',company:'company_id',customer:'customer_id',stage:'stage_id',type:'type_id',lost_reason:'lost_reason_id',related_to:'related_to_id'})[key]||key+'_id'}
function renderField([key,label,kind='text',placeholder='Enter '+label.toLowerCase()],value='',recordData={}){const v=String(value??'');if(kind.startsWith('select:')){const opts=kind.slice(7).split('|');return '<label>'+esc(label)+'<select name="'+key+'"><option value="">'+esc(placeholder)+'</option>'+opts.map(x=>'<option value="'+esc(x)+'" '+(v===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'}if(kind.startsWith('lookup:')){const idKey=lookupIdKey(key),id=String(recordData[idKey]||'');return '<label>'+esc(label)+'<div class="combo" data-lookup="'+kind.slice(7)+'" data-field="'+key+'"><input name="'+key+'" value="'+esc(v)+'" placeholder="'+esc(placeholder)+'" autocomplete="off"><input type="hidden" name="'+idKey+'" value="'+esc(id)+'">'+(key==='related_to'?'<input type="hidden" name="related_to_type" value="'+esc(recordData.related_to_type||'')+'">':'')+'<div class="combo-menu" role="listbox"></div></div><small class="field-hint">Cari lalu pilih data dari daftar. Tidak bisa menyimpan teks bebas.</small></label>'}return '<label>'+esc(label)+'<input name="'+key+'" type="'+kind+'" value="'+esc(v)+'" placeholder="'+esc(placeholder)+'" '+(key==='name'||key==='subject'?'required':'')+' '+(kind==='number'?'min="0" step="any"':'')+'></label>'}
function openForm(type,id){editing=id||null;const meta=schema[type],record=id?(rows[type]||[]).find(r=>r.id===id):null;$('#modalTitle').textContent=(record?'Edit ':'Create ')+meta.label.replace(/s$/,'');$('#fields').innerHTML=meta.fields.map(f=>renderField(f,record?.data[f[0]],record?.data||{})).join('');$('#recordForm').dataset.type=type;$('#modal').classList.add('show');bindLookups()}
async function lookupOptions(kind,q){const p=new URLSearchParams({kind,q,limit:'20'});return (await api('/api/crm/options?'+p)).data||[]}
function bindLookups(){document.querySelectorAll('[data-lookup]').forEach(combo=>{const input=combo.querySelector('input:not([type=hidden])'),hidden=combo.querySelector('input[type=hidden]'),menu=combo.querySelector('.combo-menu'),kind=combo.dataset.lookup,field=combo.dataset.field;let timer=0,seq=0;const search=async()=>{const n=++seq;try{const items=await lookupOptions(kind,input.value.trim());if(n!==seq)return;menu.innerHTML=items.length?items.map(x=>'<button type="button" class="combo-option" role="option" data-id="'+esc(x.id)+'" data-value="'+esc(x.label)+'" data-type="'+esc(x.type||'')+'">'+esc(x.label)+'</button>').join(''):'<div class="combo-empty">Tidak ada data yang cocok.</div>';combo.classList.add('open')}catch(e){menu.innerHTML='<div class="combo-empty">'+esc(e.message)+'</div>';combo.classList.add('open')}};input.addEventListener('focus',search);input.addEventListener('input',()=>{hidden.value='';const typeHidden=combo.querySelector('input[name=related_to_type]');if(typeHidden)typeHidden.value='';clearTimeout(timer);timer=setTimeout(search,250)});menu.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;input.value=b.dataset.value;hidden.value=b.dataset.id;const typeHidden=combo.querySelector('input[name=related_to_type]');if(typeHidden)typeHidden.value=b.dataset.type;combo.classList.remove('open')});input.addEventListener('keydown',e=>{if(e.key==='Escape')combo.classList.remove('open')});document.addEventListener('click',e=>{if(!combo.contains(e.target))combo.classList.remove('open')})})}
function exportCsv(type){const meta=schema[type],data=filterRows(type),lines=[meta.fields.map(x=>x[1]),...data.map(r=>meta.fields.map(([k])=>r.data[k]??''))],csv=lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download=type+'.csv';a.click();URL.revokeObjectURL(url)}
function bind(){document.querySelectorAll('[data-timeline]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{const d=await api('/api/crm/timeline?record_id='+encodeURIComponent(b.dataset.timeline));const panel=document.createElement('div');panel.className='modal show';panel.innerHTML='<div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Activity Timeline · '+esc(b.dataset.record)+'</h2><button class="btn" data-close-timeline>Close</button></div><div class="timeline-list"></div></div>';const list=panel.querySelector('.timeline-list');(d.data||[]).forEach(event=>{const item=document.createElement('article');item.className='deal';const title=document.createElement('b');title.textContent=event.summary;const meta=document.createElement('div');meta.className='muted';meta.textContent=[event.actor_name||'System',new Date(event.created_at).toLocaleString(),event.event_type].filter(Boolean).join(' · ');item.append(title,meta);list.append(item)});if(!d.data?.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Belum ada aktivitas tercatat.';list.append(empty)}panel.addEventListener('click',e=>{if(e.target===panel||e.target.closest('[data-close-timeline]'))panel.remove()});document.body.append(panel)}catch(e){toast(e.message)}finally{b.disabled=false}}));document.querySelectorAll('[data-convert]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Convert this lead into a Customer and Contact?'))return;b.disabled=true;try{await api('/api/crm/leads/'+b.dataset.convert+'/convert',{method:'POST',body:'{}'});toast('Lead converted to Customer and Contact');await render()}catch(e){toast(e.message);b.disabled=false}}));document.querySelectorAll('#view [data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));document.querySelectorAll('.kanban-deal[draggable=true]').forEach(card=>{card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',card.dataset.id);e.dataTransfer.effectAllowed='move'});});document.querySelectorAll('.kanban-column').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.style.outline='2px dashed var(--accent)'});col.addEventListener('dragleave',()=>{col.style.outline=''});col.addEventListener('drop',async e=>{e.preventDefault();col.style.outline='';const id=e.dataTransfer.getData('text/plain'),record=(rows.opportunities||[]).find(x=>x.id===id),stage=col.dataset.stage;if(!record||!stage||record.data.stage===stage)return;try{const stageRecord=stages.find(x=>x.data.name===stage),nextData={...record.data,stage};if(stageRecord){nextData.stage_id=stageRecord.id;if(stageRecord.data.probability!==undefined)nextData.probability=Number(stageRecord.data.probability)||0;}await api(API+'/'+id,{method:'PUT',body:JSON.stringify({data:nextData})});toast('Opportunity moved to '+stage);await render()}catch(err){toast(err.message)}})});$('[data-create]')?.addEventListener('click',e=>openForm(e.currentTarget.dataset.create));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.type,b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this record?'))try{await deleteRecord(b.dataset.delete);toast('Record deleted');await render()}catch(e){toast(e.message)}});let searchTimer;$('#recordSearch')?.addEventListener('input',e=>{searchTerm=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{pageNumber=1;render()},300)});$('#recordFilter')?.addEventListener('change',e=>{activeFilter=e.target.value;pageNumber=1;render()});$('#pageSize')?.addEventListener('change',e=>{pageSize=Number(e.target.value);pageNumber=1;render()});$('#prevPage')?.addEventListener('click',()=>{if(pageNumber>1){pageNumber--;render()}});$('#nextPage')?.addEventListener('click',()=>{if(pageNumber<totalPages){pageNumber++;render()}});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;sortDirection=sortField===k&&sortDirection==='asc'?'desc':'asc';sortField=k;render()});$('#exportCsv')?.addEventListener('click',()=>exportCsv(typeForPage(page)));$('#refresh')?.addEventListener('click',render)}
$('#recordForm').onsubmit=async e=>{e.preventDefault();const type=e.target.dataset.type,data=Object.fromEntries(new FormData(e.target).entries());for(const k of ['value','probability','target','sequence'])if(data[k]!=='')data[k]=Number(data[k]);for(const combo of e.target.querySelectorAll('[data-lookup]')){const input=combo.querySelector('input:not([type=hidden])'),hidden=combo.querySelector('input[type=hidden]');if(input.value.trim()&&!hidden.value){toast('Pilih '+combo.closest('label').childNodes[0].textContent.trim()+' dari daftar pencarian.');input.focus();return;}}try{await saveRecord(type,data);$('#modal').classList.remove('show');toast('Record saved to database');editing=null;await render()}catch(err){toast(err.message)}};$('#cancel').onclick=()=>$('#modal').classList.remove('show');
