</style></head><body><div class="shell"><div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div><aside class="side" id="side"><div class="brand"><div class="wordmark">orva<span>.</span></div><button class="brand-close" id="closeSidebar" type="button" aria-label="Close sidebar" title="Close sidebar">×</button></div><div class="module"><small>APPLICATION · CRM</small><b>Customer Relationship</b><small>Leads · Customers · Opportunities</small></div><div class="search"><input id="menuSearch" placeholder="Search menu..."></div><nav class="nav" id="nav"></nav><div class="user">Febro Herdyanto<small>Platform Owner</small></div></aside><main class="main"><header class="top"><button class="toggle" id="toggle">☰</button><div class="crumb">ORVA / CRM / <b id="crumb">CRM Overview</b></div><div class="topright"><a class="launcher-link" href="/" aria-label="Back to App Launcher">▦ <span>App Launcher</span></a><span class="toplabel">Febro Holdings</span><span class="avatar">FH</span></div></header><section class="content" id="view"></section></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Create record</h2><form id="recordForm"><div class="formgrid" id="fields"></div><div class="dialogfoot"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save record</button></div></form></div></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID();

let db=JSON.parse(localStorage.getItem('orva.crm.v1')||'null')||Object.fromEntries(Object.entries(seed).map(([k,rows])=>[k,rows.map(values=>({id:id(),values}))]));const persist=()=>localStorage.setItem('orva.crm.v1',JSON.stringify(db));let page='CRM Overview',editing=null;
function entity(p){if(p.includes('Lead'))return'Leads';if(p.includes('Customer')||p==='Companies'||p==='Individual Customers')return'Customers';if(p.includes('Contact'))return'Contacts';if(p.includes('Opportunit')||['Pipeline','Kanban View','Won Opportunities','Lost Opportunities','Sales Pipeline'].includes(p))return'Opportunities';if(p.includes('Activit')||['Calls','Meetings','Emails','Follow-ups','Scheduled Activities','Overdue Activities'].includes(p))return'Activities';return p}
function nav(){let h='';menu.forEach(([label,groups])=>{h+='<div class="nav-label">'+label+'</div>';groups.forEach(([name,icon,subs])=>{let open=subs.includes(page);h+='<div class="group '+(open?'open':'')+'"><button class="'+(open?'active':'')+'" data-group><span class="ico">'+icon+'</span>'+name+'<span class="chev">›</span></button><div class="sub">'+subs.map(s=>'<button data-page="'+esc(s)+'" class="'+(s===page?'active':'')+'">'+esc(s)+'</button>').join('')+'</div></div>'})});$('#nav').innerHTML=h}
function metric(label,value,trend){return '<div class="card"><div class="metric-label">'+label+' <span>↗</span></div><div class="metric-value">'+value+'</div><div class="green">'+trend+'</div></div>'}
function dashboard(){let open=db.Opportunities.filter(r=>!['Won','Lost'].includes(r.values[3])),sum=open.reduce((n,r)=>n+(Number(r.values[2])||0),0);return '<div class="head"><div><h1>CRM Overview</h1><div class="muted">Here’s what’s happening across your customer relationships.</div></div><div class="actions"><select class="field" id="period"><option value="month">This Month</option><option value="quarter">This Quarter</option><option value="year">This Year</option></select><button class="btn" id="export">↓ Export</button><button class="btn primary" data-create="Leads">＋ Add Lead</button></div></div><div class="metrics">'+metric('Total Leads',db.Leads.length,'Live records')+metric('Active Customers',db.Customers.length,'Customer records')+metric('Open Opportunities',open.length,'Active pipeline')+metric('Pipeline Value','$'+sum.toLocaleString(),'Unweighted value')+'</div><div class="grid"><div class="card"><div class="cardhead"><b>Lead & Opportunity Trends</b><small>Illustrative monthly trend</small></div><svg class="chart" viewBox="0 0 600 190"><g stroke="#edf0f4"><path d="M35 20H590M35 60H590M35 100H590M35 140H590M35 175H590"/></g><path d="M45 125L145 100L245 108L345 72L445 60L545 38" fill="none" stroke="#4263d6" stroke-width="3"/><path d="M45 160L145 150L245 155L345 135L445 130L545 115" fill="none" stroke="#20a17a" stroke-width="3"/>'+['Jan','Feb','Mar','Apr','May','Jun'].map((m,i)=>'<text x="'+(45+i*100)+'" y="188">'+m+'</text>').join('')+'</svg><small class="muted">Sample trend series · replace with live reporting data</small></div><div class="card"><div class="cardhead"><b>Opportunity Distribution</b><small>By pipeline stage</small></div>'+['New','Qualified','Proposal','Negotiation','Closing'].map(s=>{let n=open.filter(r=>r.values[3]===s).length;return '<p style="font-size:10px">'+s+' <b style="float:right">'+n+'</b></p><div style="height:6px;background:#edf0f5;border-radius:8px"><i style="display:block;height:6px;background:#4263d6;width:'+(n/(open.length||1)*100)+'%;border-radius:8px"></i></div>'}).join('')+'</div></div><div class="grid"><div class="card"><div class="cardhead"><b>Sales Pipeline</b><small>Open opportunities</small></div><div class="pipeline">'+['New','Qualified','Proposal','Negotiation','Closing'].map(s=>'<div class="stage"><h4>'+s+' · '+open.filter(r=>r.values[3]===s).length+'</h4>'+open.filter(r=>r.values[3]===s).map(r=>'<div class="deal"><b>'+esc(r.values[0])+'</b><small>'+esc(r.values[1])+'<br>$'+esc(r.values[2])+'</small></div>').join('')+'</div>').join('')+'</div></div><div class="card"><div class="cardhead"><b>Upcoming Activities</b><small>Scheduled</small></div>'+db.Activities.slice(0,5).map(r=>'<p style="font-size:10px;border-bottom:1px solid #edf0f4;padding:7px 0"><b>'+esc(r.values[0])+'</b><br><span class="muted">'+esc(r.values[2])+' · '+esc(r.values[1])+' · '+esc(r.values[3])+'</span></p>').join('')+'</div></div><div class="notice">Prototype records are stored in this browser only. For multi-user production use, connect the CRM API and database. Charts use illustrative sample series.</div>'}
function renderTable(e,p){let rows=db[e]||[],f=fields[e]||[];if(p==='My Leads')rows=rows.filter(r=>r.values[6]==='Febro');if(p==='Unassigned Leads')rows=rows.filter(r=>r.values[6]==='Unassigned');if(p==='New Leads')rows=rows.filter(r=>r.values[5]==='New');if(p==='Qualified Leads')rows=rows.filter(r=>r.values[5]==='Qualified');if(p==='Lost Leads')rows=rows.filter(r=>r.values[5]==='Lost');if(p==='My Opportunities')rows=rows.filter(r=>r.values[6]==='Febro');if(p==='Won Opportunities')rows=rows.filter(r=>r.values[3]==='Won');if(p==='Lost Opportunities')rows=rows.filter(r=>r.values[3]==='Lost');if(p==='Companies')rows=rows.filter(r=>r.values[1]==='Company');if(p==='Individual Customers')rows=rows.filter(r=>r.values[1]==='Individual');if(['Calls','Meetings','Emails','Follow-ups'].includes(p))rows=rows.filter(r=>r.values[1]===p.replace(/s$/,'')||r.values[1]===p);if(p==='Overdue Activities')rows=rows.filter(r=>r.values[6]==='Overdue');if(p==='Scheduled Activities')rows=rows.filter(r=>r.values[6]==='Scheduled');if(p==='Kanban View')return '<div class="head"><div><h1>'+esc(p)+'</h1><div class="muted">Opportunity stages</div></div></div><div class="pipeline">'+['New','Qualified','Proposal','Negotiation','Closing','Won','Lost'].map(s=>'<div class="stage"><h4>'+s+'</h4>'+rows.filter(r=>r.values[3]===s).map(r=>'<div class="deal"><b>'+esc(r.values[0])+'</b><small>'+esc(r.values[1])+'<br>$'+esc(r.values[2])+'</small></div>').join('')+'</div>').join('')+'</div>';let q=$('#q')?.value?.toLowerCase()||'';if(q)rows=rows.filter(r=>r.values.join(' ').toLowerCase().includes(q));return '<div class="head"><div><h1>'+esc(p)+'</h1><div class="muted">Manage '+esc(e.toLowerCase())+' in ORVA CRM.</div></div><button class="btn primary" data-create="'+e+'">＋ Add '+e.slice(0,-1)+'</button></div><div class="toolbar"><input id="q" class="field" placeholder="Search records..." value="'+esc(q)+'"><button class="btn" id="csv">↓ Export CSV</button></div><div class="card"><div class="cardhead"><b>'+esc(p)+'</b><small>'+rows.length+' records</small></div><div class="tablewrap"><table class="table"><thead><tr>'+f.map(x=>'<th>'+esc(x)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.values.map((v,i)=>'<td>'+(i===0?'<b>'+esc(v)+'</b>':esc(v))+'</td>').join('')+'<td><button class="btn" data-edit="'+r.id+'" data-entity="'+e+'">Edit</button> <button class="btn" data-del="'+r.id+'" data-entity="'+e+'">Delete</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No records found.</div>')+'</div></div>'}
function render(){let e=entity(page);$('#crumb').textContent=page;$('#view').innerHTML=page==='CRM Overview'||page==='Lead Statistics'||page==='Opportunity Statistics'||page==='Sales Pipeline'||page==='Conversion Rate'?dashboard():page.includes('Forecast')?'<div class="head"><div><h1>'+esc(page)+'</h1><div class="muted">Forecast summary based on open opportunities.</div></div></div><div class="metrics">'+metric('Open Pipeline','$'+db.Opportunities.filter(r=>!['Won','Lost'].includes(r.values[3])).reduce((n,r)=>n+(+r.values[2]||0),0).toLocaleString(),'Current opportunities')+metric('Won Deals',db.Opportunities.filter(r=>r.values[3]==='Won').length,'Closed won')+metric('Open Deals',db.Opportunities.filter(r=>!['Won','Lost'].includes(r.values[3])).length,'In progress')+metric('Win Rate',(db.Opportunities.length?Math.round(db.Opportunities.filter(r=>r.values[3]==='Won').length/db.Opportunities.length*100):0)+'%','Based on sample records')+'</div>':renderTable(e,page);bind()}
function bind(){$('#q')?.addEventListener('input',e=>{let v=e.target.value;render();let q=$('#q');q.value=v;q.focus();q.setSelectionRange(v.length,v.length)});$('#csv')?.addEventListener('click',()=>exportCsv(entity(page)));$('#export')?.addEventListener('click',()=>exportCsv('Leads'));document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>openForm(b.dataset.create));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.entity,b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let e=b.dataset.entity;if(confirm('Delete this record?')){db[e]=db[e].filter(r=>r.id!==b.dataset.del);persist();render();toast('Record deleted')}});$('#period')?.addEventListener('change',e=>toast('Period selected: '+e.target.options[e.target.selectedIndex].text+' · demo summary'))}
function openForm(e,recordId){editing=recordId||null;let record=recordId?db[e].find(r=>r.id===recordId):null;$('#modalTitle').textContent=(record?'Edit ':'Create ')+e.slice(0,-1);$('#fields').innerHTML=fields[e].map((f,i)=>'<label>'+esc(f)+'<input name="f'+i+'" value="'+esc(record?.values[i]||'')+'" '+(i===0?'required':'')+'></label>').join('');$('#recordForm').dataset.entity=e;$('#modal').classList.add('show')}
$('#recordForm').onsubmit=e=>{e.preventDefault();let ent=e.target.dataset.entity,values=fields[ent].map((_,i)=>e.target.elements['f'+i].value);if(editing){db[ent].find(r=>r.id===editing).values=values}else db[ent].push({id:id(),values});persist();$('#modal').classList.remove('show');render();toast('Record saved')};$('#cancel').onclick=()=>$('#modal').classList.remove('show');
function exportCsv(e){let rows=[fields[e],...db[e].map(r=>r.values)],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=u;a.download=e.toLowerCase()+'.csv';a.click();URL.revokeObjectURL(u)}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2200)}
$('#nav').onclick=e=>{let p=e.target.closest('[data-page]'),g=e.target.closest('[data-group]');if(p){page=p.dataset.page;nav();render();if(innerWidth<650)$('#side').classList.remove('mobile')}else if(g){g.parentElement.classList.toggle('open');g.classList.toggle('active')}};$('#menuSearch').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.group').forEach(g=>{let match=[...g.querySelectorAll('[data-page]')].some(b=>b.textContent.toLowerCase().includes(q));g.hidden=!!q&&!g.textContent.toLowerCase().includes(q)&&!match;if(q&&match)g.classList.add('open')})};function closeSidebar(){$('#side').classList.remove('mobile');$('#sidebarBackdrop').classList.remove('show')}function toggleSidebar(){const opened=$('#side').classList.toggle('mobile');$('#sidebarBackdrop').classList.toggle('show',opened)}$('#toggle').onclick=toggleSidebar;$('#closeSidebar').onclick=closeSidebar;$('#sidebarBackdrop').onclick=closeSidebar;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar()});nav();render();
</script></body></html>
