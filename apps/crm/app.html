<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORVA CRM</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');:root{--n:#1A2334;--a:#4263D6;--bg:#F7F8FA;--ink:#202D42;--muted:#8290A5;--line:#E7EBF0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Manrope,system-ui}button,input,select{font:inherit;cursor:pointer}.side{position:fixed;inset:0 auto 0 0;width:258px;background:var(--n);color:#d2dcea;display:flex;flex-direction:column;z-index:4}.brand{padding:22px;border-bottom:1px solid #ffffff18}.logo{font-size:32px;font-weight:800;letter-spacing:-2px;color:white}.logo span{color:var(--a)}.tag{font-size:9px;letter-spacing:2.5px;color:#91a2ba}.module{margin:14px;padding:12px;background:#222e42;border-radius:8px;font-size:10px;color:#91a2ba}.module b{display:block;color:white;margin:7px 0}.search{margin:0 13px 10px;padding:9px;background:#ffffff0c;border:1px solid #ffffff20;border-radius:7px;color:white}.nav{overflow:auto;flex:1;padding:0 11px}.label{font-size:9px;letter-spacing:1.5px;color:#71839d;padding:12px 9px 6px}.group>button{width:100%;display:flex;gap:9px;padding:10px;border:0;background:none;color:#c1ccdc;text-align:left;border-radius:6px;font-size:11px}.group>button.active,.group>button:hover{background:#30466b;color:white}.chev{margin-left:auto}.subs{display:none;margin-left:17px;padding-left:10px;border-left:1px solid #ffffff25}.group.open .subs{display:block}.subs button{display:block;width:100%;padding:8px;border:0;background:none;color:#91a2ba;text-align:left;font-size:10px;border-radius:5px}.subs button.active,.subs button:hover{background:#536fe526;color:#a9bcff}.user{padding:14px;border-top:1px solid #ffffff18;color:white;font-size:10px}.main{margin-left:258px}.top{height:58px;background:white;border-bottom:1px solid var(--line);padding:19px 24px;color:var(--muted);font-size:10px}.content{padding:24px;max-width:1600px;margin:auto}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.head h1{font-size:23px;margin:0}.muted{font-size:11px;color:var(--muted);margin-top:5px}.btn{border:1px solid #dce2ea;background:white;border-radius:7px;padding:8px 11px;font-size:10px;color:#344257}.primary{background:var(--a);color:white;border-color:var(--a)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:14px;min-width:0}.metric-label{font-size:10px;color:#77869a}.metric-value{font-size:25px;font-weight:800;margin:8px 0}.green{color:#16865c;font-size:9px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin:12px 0}.cardhead{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px}.cardhead small{font-size:9px;color:var(--muted)}svg{width:100%;height:auto;display:block}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:9px;color:#8995a6;padding:9px;border-bottom:1px solid var(--line)}td{font-size:10px;padding:10px 9px;border-bottom:1px solid #f0f2f5;white-space:nowrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field{padding:9px;border:1px solid #dce2ea;border-radius:7px;background:white;font-size:10px}.field.searchfield{flex:1;min-width:180px}.pill{padding:4px 7px;border-radius:5px;background:#eef2ff;color:#435fc1;font-size:9px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:9px;overflow:auto}.lane{background:#edf0f5;padding:9px;border-radius:8px}.deal{background:white;padding:10px;margin:7px 0;border-radius:7px;font-size:10px}.deal small{display:block;color:var(--muted);margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#10182788;z-index:9;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.dialog{background:white;border-radius:12px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formfield{display:flex;flex-direction:column;gap:5px;font-size:10px;color:#64748b}.formfield input,.formfield select{padding:9px;border:1px solid #dce2ea;border-radius:6px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:10px;background:#edf2ff;color:#3d56a5;border-radius:7px;font-size:10px;margin-top:12px}.activity{padding:10px 0;border-bottom:1px solid var(--line);font-size:10px}.activity small{display:block;color:var(--muted);margin-top:4px}.toast{position:fixed;bottom:20px;right:20px;background:var(--n);color:white;padding:12px;border-radius:8px;z-index:10}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.side{transform:translateX(-100%);transition:.2s}.side.mobile{transform:translateX(0)}.main{margin:0}.content{padding:15px 12px}.metrics{gap:7px}.metric-value{font-size:21px}.toggle{display:inline-block!important}.formgrid{grid-template-columns:1fr}}.toggle{display:none;border:0;background:none}
</style></head><body><aside class="side" id="side"><div class="brand"><div class="logo">orva<span>.</span></div><div class="tag">BUSINESS PLATFORM</div></div><div class="module">MODULE · v1.0.0<b>Customer Relationship</b>CRM Workspace</div><input class="search" id="menuSearch" placeholder="⌕ Search menu"><nav class="nav" id="nav"></nav><div class="user">◉ &nbsp; Workspace Admin<br><small>Platform Administrator</small></div></aside><main class="main"><header class="top"><button class="toggle" id="toggle">☰</button> Workspace / <b id="crumb">CRM Overview</b></header><section class="content" id="view"></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="recordForm"><div class="formgrid" id="fields"></div><div class="dialogfoot"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID();
const menus=[['CRM WORKSPACE',[['Dashboard','▦',['CRM Overview','Lead Statistics','Opportunity Statistics','Sales Pipeline','Conversion Rate','Sales Forecast']],['Leads','♧',['All Leads','My Leads','Unassigned Leads','New Leads','Qualified Leads','Lost Leads','Lead Sources','Lead Import']],['Customers','♙',['All Customers','Companies','Individual Customers','Customer Categories','Customer Groups','Customer Addresses','Customer Contacts']],['Contacts','♧',['All Contacts','Contact Persons','Contact Directory','Contact Activities']],['Opportunities','◈',['All Opportunities','My Opportunities','Pipeline','Kanban View','Won Opportunities','Lost Opportunities','Lost Reasons']],['Activities','◷',['All Activities','Calls','Meetings','Emails','Follow-ups','Scheduled Activities','Overdue Activities']],['Sales Forecast','⌁',['Forecast Overview','Forecast by Salesperson','Forecast by Team','Forecast by Period']]]],['ADMINISTRATION',[['Configuration','⚙',['Lead Sources','Pipeline Stages','Activity Types','Lost Reasons','Sales Teams']]]]];
const defs={Leads:['Name','Company','Email','Phone','Source','Status','Owner'],Customers:['Name','Type','Category','Group','Email','Phone','Website','Address'],Contacts:['Name','Company','Job Title','Email','Phone','Owner'],Opportunities:['Name','Customer','Value','Stage','Probability','Expected Close','Owner'],Activities:['Subject','Type','Related To','Due Date','Time','Owner','Status','Notes'],'Lead Sources':['Name','Description','Active'],'Pipeline Stages':['Name','Probability','Sequence','Active'],'Activity Types':['Name','Description','Active'],'Lost Reasons':['Name','Description','Active'],'Sales Teams':['Name','Manager','Members','Target','Active']};
const seed={Leads:[['Andi Pratama','PT Samudra Energi','andi@samudra.co.id','081211112222','Website','Qualified','Febro'],['Maya Putri','Energi Nusantara','maya@energi.co.id','081233334444','Referral','New','Unassigned'],['Budi Santoso','PT Maju Teknik','budi@maju.co.id','081255556666','LinkedIn','New','Febro']],Customers:[['PT Samudra Energi','Company','Oil & Gas','Enterprise','procurement@samudra.co.id','0215550101','samudra.co.id','Jakarta'],['Energi Nusantara','Company','Oil & Gas','Corporate','hello@energi.co.id','0215550102','energi.co.id','Surabaya']],Contacts:[['Andi Pratama','PT Samudra Energi','Procurement Manager','andi@samudra.co.id','081211112222','Febro']],Opportunities:[['Offshore Equipment Supply','PT Samudra Energi','85000','Proposal','70','2026-12-20','Febro'],['Maintenance Contract 2027','Energi Nusantara','64500','Negotiation','80','2027-01-15','Febro'],['Industrial Pump Package','PT Maju Teknik','42000','Qualified','40','2027-02-01','Febro']],Activities:[['Client discovery call','Call','PT Samudra Energi','2026-11-20','09:30','Febro','Scheduled','Discuss requirements'],['Proposal review','Meeting','Energi Nusantara','2026-11-20','11:00','Febro','Scheduled','Review proposal']], 'Lead Sources':[['Website','Company website','Yes'],['Referral','Customer referral','Yes'],['LinkedIn','Social network','Yes'],['Campaign','Marketing campaign','Yes']],'Pipeline Stages':[['New','10','1','Yes'],['Qualified','30','2','Yes'],['Proposal','50','3','Yes'],['Negotiation','75','4','Yes'],['Closing','90','5','Yes']],'Activity Types':[['Call','Phone conversation','Yes'],['Meeting','Client meeting','Yes'],['Email','Email communication','Yes'],['Follow-up','Follow-up task','Yes']],'Lost Reasons':[['Price','Price not competitive','Yes'],['Competitor','Selected competitor','Yes']],'Sales Teams':[['Enterprise Sales','Febro','Febro, Maya','500000','Yes']]};
let db={};try{db=JSON.parse(localStorage.getItem('orva.crm.v1')||'{}')}catch{};Object.entries(seed).forEach(([k,rows])=>{if(!Array.isArray(db[k]))db[k]=rows.map(values=>({id:uid(),values}))});const save=()=>localStorage.setItem('orva.crm.v1',JSON.stringify(db));let page='CRM Overview',editing=null;
function nav(){let h='';menus.forEach(([l,gs])=>{h+='<div class="label">'+l+'</div>';gs.forEach(([n,ic,ss])=>{let o=ss.includes(page);h+='<div class="group '+(o?'open':'')+'"><button class="'+(o?'active':'')+'" data-group>'+ic+' &nbsp;'+n+'<span class="chev">'+(o?'⌄':'›')+'</span></button><div class="subs">'+ss.map(s=>'<button data-page="'+E(s)+'" class="'+(s===page?'active':'')+'">'+E(s)+'</button>').join('')+'</div></div>'})});$('#nav').innerHTML=h}
function entity(p){if(p.includes('Lead'))return'Leads';if(p.includes('Customer')||p==='Companies'||p==='Individual Customers')return'Customers';if(p.includes('Contact'))return'Contacts';if(p.includes('Opportunit')||['Pipeline','Kanban View','Won Opportunities','Lost Opportunities','Sales Pipeline'].includes(p))return'Opportunities';if(p.includes('Activit')||['Calls','Meetings','Emails','Follow-ups','Scheduled Activities','Overdue Activities'].includes(p))return'Activities';return p}
function table(e,p){let rows=db[e]||[],f=defs[e];if(!f)return '<div class="card"><b>'+E(p)+'</b><p class="muted">Configuration view</p></div>';if(p==='My Leads')rows=rows.filter(r=>r.values[6]==='Febro');if(p==='Unassigned Leads')rows=rows.filter(r=>r.values[6]==='Unassigned');if(p==='New Leads')rows=rows.filter(r=>r.values[5]==='New');if(p==='Qualified Leads')rows=rows.filter(r=>r.values[5]==='Qualified');if(p==='Lost Leads')rows=rows.filter(r=>r.values[5]==='Lost');if(p==='My Opportunities')rows=rows.filter(r=>r.values[6]==='Febro');if(p==='Won Opportunities')rows=rows.filter(r=>r.values[3]==='Won');if(p==='Lost Opportunities')rows=rows.filter(r=>r.values[3]==='Lost');if(p==='Companies')rows=rows.filter(r=>r.values[1]==='Company');if(p==='Individual Customers')rows=rows.filter(r=>r.values[1]==='Individual');if(['Calls','Meetings','Emails','Follow-ups'].includes(p))rows=rows.filter(r=>r.values[1]===p.replace(/s$/,'')||r.values[1]===p);if(p==='Overdue Activities')rows=rows.filter(r=>r.values[6]==='Overdue');if(p==='Scheduled Activities')rows=rows.filter(r=>r.values[6]==='Scheduled');if(p==='Lead Import')return '<div class="card"><b>Import Leads from CSV</b><p class="muted">Columns: '+f.join(', ')+'</p><input type="file" id="csvFile" accept=".csv"><button class="btn primary" id="import">Import CSV</button></div>';if(p==='Kanban View')return '<div class="kanban">'+['New','Qualified','Proposal','Negotiation','Closing','Won','Lost'].map(s=>'<div class="lane"><b>'+s+'</b>'+rows.filter(r=>r.values[3]===s).map(r=>'<div class="deal"><b>'+E(r.values[0])+'</b><small>'+E(r.values[1])+' · $'+E(r.values[2])+'</small></div>').join('')+'</div>').join('')+'</div>';let q=$('#q')?.value?.toLowerCase()||'';if(q)rows=rows.filter(r=>r.values.join(' ').toLowerCase().includes(q));return '<div class="toolbar"><input class="field searchfield" id="q" placeholder="Search records..." value="'+E(q)+'"><button class="btn" id="export">↓ Export CSV</button><button class="btn primary" id="add">＋ Add '+E(e.slice(0,-1))+'</button></div><div class="card"><div class="cardhead"><b>'+E(p)+'</b><small>'+rows.length+' records</small></div><div class="tablewrap"><table><thead><tr>'+f.map(x=>'<th>'+E(x)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.values.map((v,i)=>'<td>'+(i===0?'<b>'+E(v)+'</b>':E(v))+'</td>').join('')+'<td><button class="btn" data-edit="'+r.id+'">Edit</button> <button class="btn" data-del="'+r.id+'">Delete</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="muted">No records found.</div>')+'</div></div>'}
function dashboard(){let open=db.Opportunities.filter(r=>!['Won','Lost'].includes(r.values[3])),val=open.reduce((s,r)=>s+(+r.values[2]||0),0);return '<div class="metrics">'+[['Total Leads',db.Leads.length],['Active Customers',db.Customers.length],['Open Opportunities',open.length],['Pipeline Value','$'+val.toLocaleString()]].map(x=>'<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+x[1]+'</div><div class="green">↗ Live local records</div></div>').join('')+'</div><div class="grid"><div class="card"><div class="cardhead"><b>Lead & Opportunity Trends</b><small>Illustrative monthly trend</small></div><svg viewBox="0 0 600 200"><g stroke="#edf0f4"><path d="M40 25H590M40 65H590M40 105H590M40 145H590M40 185H590"/></g><path d="M50 125L150 100L250 108L350 72L450 60L550 38" fill="none" stroke="#4263D6" stroke-width="3"/><path d="M50 165L150 155L250 160L350 143L450 135L550 125" fill="none" stroke="#78A6B8" stroke-width="3"/>'+['Jan','Feb','Mar','Apr','May','Jun'].map((m,i)=>'<text x="'+(50+i*100)+'" y="198" fill="#8995a6" text-anchor="middle" font-size="10">'+m+'</text>').join('')+'</svg><small class="muted">Blue: leads · Teal: opportunities</small></div><div class="card"><div class="cardhead"><b>Opportunity Distribution</b><small>By stage</small></div>'+['New','Qualified','Proposal','Negotiation','Closing','Won','Lost'].map(s=>{let n=db.Opportunities.filter(r=>r.values[3]===s).length;return '<p>'+s+' <b style="float:right">'+n+'</b></p><div style="height:6px;background:#edf0f5;border-radius:8px"><i style="display:block;height:6px;background:#4263D6;width:'+(n/(db.Opportunities.length||1)*100)+'%;border-radius:8px"></i></div>'}).join('')+'</div></div><div class="grid"><div class="card"><div class="cardhead"><b>Sales Pipeline</b><small>Value by stage</small></div>'+['New','Qualified','Proposal','Negotiation','Closing'].map(s=>{let v=open.filter(r=>r.values[3]===s).reduce((a,r)=>a+(+r.values[2]||0),0);return '<p>'+s+' <b style="float:right">$'+v.toLocaleString()+'</b></p><div style="height:7px;background:#edf0f5;border-radius:8px"><i style="display:block;height:7px;background:#47799D;width:'+(v/(val||1)*100)+'%;border-radius:8px"></i></div>'}).join('')+'</div><div class="card"><div class="cardhead"><b>Revenue Forecast</b><small>Sample USD · K</small></div><svg viewBox="0 0 400 190"><g fill="#4263D6">'+[45,70,75,95,115,130].map((h,i)=>'<rect x="'+(35+i*58)+'" y="'+(150-h)+'" width="17" height="'+h+'" rx="3"/>').join('')+'</g><g fill="#78A6B8">'+[55,80,88,105,125,140].map((h,i)=>'<rect x="'+(53+i*58)+'" y="'+(150-h)+'" width="17" height="'+h+'" rx="3"/>').join('')+'</g>'+['Jan','Feb','Mar','Apr','May','Jun'].map((m,i)=>'<text x="'+(52+i*58)+'" y="170" fill="#8995a6" font-size="9" text-anchor="middle">'+m+'</text>').join('')+'</svg><small class="muted">Blue: actual · Teal: forecast (illustrative)</small></div></div><div class="grid"><div class="card"><div class="cardhead"><b>Recent Opportunities</b><small>Latest records</small></div>'+mini(open.slice(-5).reverse())+'</div><div class="card"><div class="cardhead"><b>Upcoming Activities</b><small>Scheduled items</small></div>'+db.Activities.slice(0,5).map(r=>'<div class="activity"><b>'+E(r.values[0])+'</b><small>'+E(r.values[2])+' · '+E(r.values[1])+'</small></div>').join('')+'</div></div><div class="notice">Prototype data is stored in this browser using localStorage. Monthly chart series are illustrative; connect an API/database for multi-user production use.</div>'}
function mini(rows){return '<div class="tablewrap"><table><thead><tr><th>Opportunity</th><th>Customer</th><th>Value</th><th>Stage</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+[0,1,2,3].map(i=>'<td>'+E(r.values[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function forecast(){let win=db.Opportunities.filter(r=>r.values[3]==='Won'),op=db.Opportunities.filter(r=>!['Won','Lost'].includes(r.values[3])),sum=a=>a.reduce((s,r)=>s+(+r.values[2]||0),0);return '<div class="metrics">'+[['Open Pipeline','$'+sum(op).toLocaleString()],['Won Revenue','$'+sum(win).toLocaleString()],['Open Deals',op.length],['Win Rate',(db.Opportunities.length?Math.round(win.length/db.Opportunities.length*100):0)+'%']].map(x=>'<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+x[1]+'</div></div>').join('')+'</div><div class="card"><b>'+E(page)+'</b><p class="muted">Forecast calculated from current opportunity records.</p>'+mini(op)+'</div>'}
function render(){let p=page,e=entity(p),body=p==='CRM Overview'?dashboard():p.includes('Forecast')||p==='Sales Forecast'?forecast():table(e,p);$('#crumb').textContent=p;$('#view').innerHTML='<div class="head"><div><h1>'+E(p)+'</h1><div class="muted">Manage customer relationships in ORVA CRM.</div></div><button class="btn" id="refresh">↻ Refresh</button></div>'+body;$('#refresh')?.addEventListener('click',render);$('#add')?.addEventListener('click',()=>modal(e));$('#q')?.addEventListener('input',()=>{let v=$('#q').value;render();$('#q').value=v;$('#q').focus();$('#q').setSelectionRange(v.length,v.length)});$('#export')?.addEventListener('click',()=>csv(e));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>modal(e,b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this record?')){db[e]=db[e].filter(r=>r.id!==b.dataset.del);save();render();toast('Record deleted')}});$('#import')?.addEventListener('click',importCsv)}
function modal(e,id){if(!defs[e])return;editing=id||null;let rec=id?db[e].find(x=>x.id===id):null;$('#modalTitle').textContent=(id?'Edit ':'Create ')+e.slice(0,-1);$('#fields').innerHTML=defs[e].map((f,i)=>'<label class="formfield">'+E(f)+'<input name="f'+i+'" value="'+E(rec?.values[i]||'')+'" '+(i===0?'required':'')+'></label>').join('');$('#recordForm').dataset.entity=e;$('#modal').classList.add('show')}
function csv(e){let rows=[defs[e],...db[e].map(r=>r.values)],txt=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(txt,e.toLowerCase()+'.csv','text/csv')}
function download(txt,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importCsv(){let f=$('#csvFile').files[0];if(!f)return toast('Choose a CSV file first');let rd=new FileReader();rd.onload=()=>{let lines=rd.result.split(/\r?\n/).slice(1).filter(Boolean);lines.forEach(line=>db.Leads.push({id:uid(),values:line.split(',').map(x=>x.replace(/^"|"$/g,''))}));save();render();toast(lines.length+' leads imported')};rd.readAsText(f)}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2500)}
$('#nav').onclick=e=>{let p=e.target.closest('[data-page]'),g=e.target.closest('[data-group]');if(p){page=p.dataset.page;nav();render();if(innerWidth<650)$('#side').classList.remove('mobile')}else if(g){g.parentElement.classList.toggle('open');g.classList.toggle('active')}};$('#menuSearch').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.group').forEach(g=>{let ss=[...g.querySelectorAll('[data-page]')],n=0;ss.forEach(b=>{b.hidden=!b.textContent.toLowerCase().includes(q);if(!b.hidden)n++});g.hidden=!!q&&!g.textContent.toLowerCase().includes(q)&&!n;if(q&&n)g.classList.add('open')})};$('#toggle').onclick=()=>$('#side').classList.toggle('mobile');$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#recordForm').onsubmit=e=>{e.preventDefault();let ent=e.target.dataset.entity,values=defs[ent].map((_,i)=>e.target.elements['f'+i].value);if(editing){db[ent].find(r=>r.id===editing).values=values}else db[ent].push({id:uid(),values});save();$('#modal').classList.remove('show');render();toast('Record saved')};nav();render();
</script></body></html>
